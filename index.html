<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proof</title>
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Proof">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-tab="library">

  <section id="lib" class="pane" aria-label="Library">
    <header class="bar">
      <h1>Proof</h1>
      <span class="spacer"></span>
      <button id="btn-sync" class="text-btn" type="button">Sync</button>
      <button id="btn-settings-d" class="text-btn desk-only" type="button">Settings</button>
      <button id="btn-new" class="primary" type="button">New piece</button>
    </header>
    <p id="sync-line" class="subtle sync-line"></p>
    <div class="search"><input id="q" type="search" placeholder="Search titles and text" autocomplete="off" aria-label="Search pieces"></div>
    <div id="filters" class="filters" role="tablist" aria-label="Filter by status"></div>
    <ul id="list" class="list"></ul>
  </section>

  <section id="write" class="pane" aria-label="Write">
    <div id="write-empty" class="empty">
      <p>No piece open.</p>
      <p class="subtle">Pick one from the library, or start a new one.</p>
      <button id="btn-new-empty" class="primary" type="button">New piece</button>
    </div>
    <div id="write-main" class="write-main">
      <header class="bar">
        <select id="status" aria-label="Status"></select>
        <span class="spacer"></span>
        <button id="btn-checkpoint" class="text-btn" type="button">Checkpoint</button>
        <button id="btn-menu" class="text-btn" type="button">More</button>
      </header>
      <div id="banner" class="banner" hidden>
        <span>This piece changed on GitHub and here.</span>
        <button id="btn-resolve" class="text-btn" type="button">Resolve</button>
      </div>
      <input id="title" class="title" type="text" placeholder="Untitled" autocomplete="off" aria-label="Title">
      <button id="meter" class="meter" type="button" aria-expanded="false" aria-controls="checks"></button>
      <div id="checks" class="checks" hidden></div>
      <textarea id="body" spellcheck="true" autocapitalize="sentences" placeholder="Start writing"></textarea>
    </div>
  </section>

  <section id="review" class="pane" aria-label="Review">
    <header class="bar">
      <h2>Review</h2>
    </header>
    <div class="review-scroll">
      <div id="pass-row" class="passes" role="tablist" aria-label="Pass"></div>
      <p id="pass-hint" class="subtle"></p>
      <div class="controls">
        <label class="inline">
          <span>Scope</span>
          <select id="scope">
            <option value="auto">Automatic</option>
            <option value="selection">Selection</option>
            <option value="section">Section at cursor</option>
            <option value="whole">Whole piece</option>
          </select>
        </label>
        <p id="target-line" class="subtle"></p>
        <input id="instruction" type="text" placeholder="Instruction (optional)" autocomplete="off" aria-label="Instruction">
        <div class="run-row">
          <button id="btn-run" class="primary" type="button">Run</button>
          <button id="btn-abort" class="text-btn" type="button" hidden>Stop</button>
          <span id="run-status" class="subtle" aria-live="polite"></span>
        </div>
      </div>
      <div id="reply-box" class="reply" hidden>
        <label class="field">
          <span class="lbl">Claude's reply</span>
          <textarea id="reply" class="field-area" rows="4" placeholder="Paste Claude's reply here" spellcheck="false"></textarea>
        </label>
        <div class="btn-row">
          <button id="btn-read" class="primary" type="button">Read reply</button>
          <button id="btn-paste" class="text-btn" type="button">Paste and read</button>
        </div>
        <p id="paste-hint" class="subtle"></p>
      </div>
      <div id="results" class="results"></div>
    </div>
  </section>

  <section id="settings" class="pane" aria-label="Settings">
    <header class="bar">
      <h2>Settings</h2>
      <span id="saved" class="subtle saved" aria-live="polite"></span>
      <span class="spacer"></span>
      <button id="btn-settings-done" class="text-btn desk-only" type="button">Done</button>
    </header>
    <div id="settings-body" class="settings-body"></div>
  </section>

  <nav id="tabs" aria-label="Sections">
    <button type="button" data-tab="library" aria-current="page">Library</button>
    <button type="button" data-tab="write" aria-current="false">Write</button>
    <button type="button" data-tab="review" aria-current="false">Review</button>
    <button type="button" data-tab="settings" aria-current="false">Settings</button>
  </nav>
</div>

<dialog id="modal">
  <header class="modal-head">
    <h2 id="modal-title"></h2>
    <button id="modal-close" class="text-btn" type="button">Close</button>
  </header>
  <div id="modal-body" class="modal-body"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
